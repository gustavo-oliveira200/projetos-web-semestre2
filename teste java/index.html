<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>
    <link rel="stylesheet" href="style.css">
    <script src="scrip.js" defer></script>
</head>
<body>
    <div class="corpo">
        <h1>CALCULADORA IMC</h1>
            <label for="name">DIGITE SEU NOME</label>
                <input type="text" id="nome">
                    <br><br>
            <label for="peso">DIGITE SEU PESO(KG)</label>
                 <input type="number" id="peso" step="0.01">
                    <br><br>
            <label for="altura">DIGITE SUA ALTURA(M)</label>
                 <input type="number" id="altura" step="0.01">
                    <br><br>
                    <button onclick="calcular()">CALCULAR SEU IMC</button>
    <h2 id="resultado"></h2>
    </div>
</body>
</html>
