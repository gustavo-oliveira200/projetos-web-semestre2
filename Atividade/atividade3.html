<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Compra com Desconto e Frete</title>
    <link rel="stylesheet" href="atividade3.css">
    <script src="atividade3.js" defer></script>
</head>

<body>

    <div class="corpo">

        <h1>SISTEMA DE COMPRA</h1>

        <label for="valor">DIGITE O VALOR DA COMPRA</label>
        <input type="number" id="valor" step="0.01">

        <br><br>

        <label for="distancia">DIGITE A DISTÂNCIA DA ENTREGA</label>
        <input type="number" id="distancia" step="0.01">

        <br><br>

        <label for="cliente">SELECIONE O TIPO DE CLIENTE</label>
        <select id="cliente">
            <option value="comum">COMUM</option>
            <option value="vip">VIP</option>
            <option value="premium">PREMIUM</option>
        </select>

        <br><br>

        <label for="pagamento">SELECIONE A FORMA DE PAGAMENTO</label>
        <select id="pagamento">
            <option value="cartao">CARTÃO</option>
            <option value="dinheiro">DINHEIRO</option>
            <option value="pix">PIX</option>
        </select>

        <br><br>

        <button onclick="calcular()">CALCULAR COMPRA</button>

        <h2 id="resultado"></h2>

    </div>

</body>
</html>
