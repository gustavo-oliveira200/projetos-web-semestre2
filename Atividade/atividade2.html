<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas e Situação do Aluno</title>
    <link rel="stylesheet" href="atividade2.css">
    <script src="atividade2.js" defer></script>
</head>
<body>
    <div class="corpo">
        <h1>CALCULO DA MEDIA FINAL</h1>
            <label for="name">DIGITE O NOME DO ALUNO</label>
                <input type="text" id="nome">
                    <br><br>
            <label for="salario">INFORME A NOTA DA AV1</label>
                 <input type="number" id="av1" step="0.01">
                    <br><br>
            <label for="emprestimo">INFORME A NOTA DA AV2</label>
                 <input type="number" id="av2" step="0.01">
                    <br><br>
                    <label for="parcela">INFORME A NOTA DO TRABALHO</label>
                 <input type="number" id="trabalho" step="0.01">
                 <br><br>
                 <label for="divida">INFORME O PERCENTUAL DE FREQUENCIA</label>
                 <input type="number" id="frequencia" step="0.01">
                    <button onclick="calcular()">CALCULAR A MEDIA FINAL</button>
    <h2 id="resultado"></h2>
    </div>
</body>
</html>
