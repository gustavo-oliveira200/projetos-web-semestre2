<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vetores em JavaScript</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Cadastro de Alunos</h1>

        <div class="formulario">

            <input
                type="text"
                id="nomeAluno"
                placeholder="Digite o nome do aluno"
            >

            <button onclick="adicionarAluno()">
                Adicionar
            </button>

        </div>

        <h2>Alunos cadastrados</h2>

        <ul id="listaAlunos"></ul>

        <div class="informacoes">

            <p>
                Total de alunos:
                <strong id="totalAlunos">0</strong>
            </p>

        </div>

        <button
            class="btn-remover"
            onclick="removerUltimoAluno()">

            Remover último aluno

        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
